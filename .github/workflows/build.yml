name: Build Oblivionis Kernel

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      ARCH: arm64
      TOOLCHAINS_DIR: ${{ github.workspace }}/toolchains
      OUT_DIR: ${{ github.workspace }}/kernel/out
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      ZIP_PREFIX: Oblivionis
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          path: kernel

      - name: Verify 5.10 BPF present
        working-directory: kernel
        run: |
          for f in ringbuf.c trampoline.c btf.c bpf_iter.c local_storage.c bpf_lsm.c; do
            if [ -f "bpf/$f" ]; then echo "OK      kernel/bpf/$f"; else echo "MISSING kernel/bpf/$f"; fi
          done
          ls -la security/bpf/ 2>/dev/null || echo "MISSING security/bpf/"

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref }}-
            ${{ runner.os }}-ccache-

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip unzip zlib1g-dev python3 python3-pip imagemagick \
            cpio device-tree-compiler libelf-dev dwarves zstd
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install toolchains
        run: |
          mkdir -p "${TOOLCHAINS_DIR}"
          cd "${TOOLCHAINS_DIR}"
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-arm64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm32

      - name: Fetch external patches (BORE / Simple_LMK / BBG)
        working-directory: kernel
        continue-on-error: true
        run: |
          mkdir -p patches/external

          echo "=== 1. BORE scheduler ==="
          git clone --depth=1 https://github.com/firelzrd/bore-scheduler.git /tmp/bore || echo "bore clone failed"
          if [ -d /tmp/bore ]; then
            echo "--- bore tree ---"
            find /tmp/bore -maxdepth 3 -type d | head -30
            echo "--- bore .patch files ---"
            find /tmp/bore -name '*.patch' | head -30
          fi

          echo "=== 2. Simple_LMK ==="
          git clone --depth=1 https://github.com/kerneltoast/simple_lmk.git /tmp/simple_lmk || echo "simple_lmk clone failed"
          if [ -d /tmp/simple_lmk ]; then
            echo "--- simple_lmk tree ---"
            ls -la /tmp/simple_lmk/
            echo "--- branches ---"
            cd /tmp/simple_lmk && git branch -a && cd -
          fi

          echo "=== 3. Baseband-guard ==="
          git clone --depth=1 https://github.com/vc-teahouse/Baseband-guard.git /tmp/bbg || echo "bbg clone failed"
          if [ -d /tmp/bbg ]; then
            echo "--- bbg tree ---"
            find /tmp/bbg -maxdepth 3 -type f | head -40
            echo "--- bbg setup.sh head ---"
            head -50 /tmp/bbg/setup.sh 2>/dev/null || echo "no setup.sh"
          fi

      - name: Apply user patches
        working-directory: kernel
        run: |
          git config user.email ci@local
          git config user.name CI
          shopt -s nullglob
          P=(patches/*.patch)
          if [ ${#P[@]} -eq 0 ]; then echo "no patches"; exit 0; fi
          for p in "${P[@]}"; do
            echo "applying $p"
            if ! git apply --3way --whitespace=nowarn "$p"; then
              echo "::error::patch failed: $p"
              exit 1
            fi
          done

      - name: Integrate Simple_LMK (best-effort)
        working-directory: kernel
        continue-on-error: true
        run: |
          if [ ! -d /tmp/simple_lmk ]; then
            echo "::warning::simple_lmk source not available, skip"
            exit 0
          fi
          echo "=== simple_lmk contents ==="
          ls -la /tmp/simple_lmk/
          # 常见的 simple_lmk 结构：drivers/staging/simple_lmk/ 或 drivers/misc/simple_lmk/
          SRC=""
          for d in /tmp/simple_lmk/drivers/staging/simple_lmk /tmp/simple_lmk/drivers/misc/simple_lmk /tmp/simple_lmk; do
            if [ -f "$d/simple_lmk.c" ]; then SRC="$d"; break; fi
          done
          if [ -z "$SRC" ]; then
            echo "::warning::simple_lmk.c not found in expected paths, skip"
            exit 0
          fi
          echo "found simple_lmk source at $SRC"
          mkdir -p drivers/staging/simple_lmk
          cp "$SRC"/*.c "$SRC"/*.h drivers/staging/simple_lmk/ 2>/dev/null || true
          cat > drivers/staging/simple_lmk/Kconfig <<'EOF'
config SIMPLE_LMK
	bool "Simple LMK"
	default y
EOF
          cat > drivers/staging/simple_lmk/Makefile <<'EOF'
obj-$(CONFIG_SIMPLE_LMK) += simple_lmk.o
EOF
          # 挂到 drivers/staging/Kconfig 和 Makefile
          if ! grep -q "simple_lmk" drivers/staging/Kconfig 2>/dev/null; then
            printf '\nsource "drivers/staging/simple_lmk/Kconfig"\n' >> drivers/staging/Kconfig
          fi
          if ! grep -q "simple_lmk" drivers/staging/Makefile 2>/dev/null; then
            echo 'obj-$(CONFIG_SIMPLE_LMK) += simple_lmk/' >> drivers/staging/Makefile
          fi
          echo "simple_lmk integration attempted"

      - name: Integrate Baseband-guard (best-effort)
        working-directory: kernel
        continue-on-error: true
        run: |
          if [ ! -d /tmp/bbg ]; then
            echo "::warning::Baseband-guard source not available, skip"
            exit 0
          fi
          echo "=== bbg setup.sh inspection ==="
          if [ -f /tmp/bbg/setup.sh ]; then
            head -80 /tmp/bbg/setup.sh
            echo "=== running bbg setup.sh (dry attempt) ==="
            cd /tmp/bbg && bash setup.sh 2>&1 | head -50 || true
          else
            echo "no setup.sh, try manual integration"
            # 手动集成：把 bbg 目录 cp 到 security/
            if [ -d /tmp/bbg/security/baseband_guard ]; then
              cp -r /tmp/bbg/security/baseband_guard security/
              if ! grep -q "baseband_guard" security/Kconfig 2>/dev/null; then
                printf '\nsource "security/baseband_guard/Kconfig"\n' >> security/Kconfig
              fi
              if ! grep -q "baseband_guard" security/Makefile 2>/dev/null; then
                echo 'obj-$(CONFIG_SECURITY_BBG) += baseband_guard/' >> security/Makefile
              fi
              echo "bbg manual integration attempted"
            else
              echo "::warning::bbg structure unknown, skip"
            fi
          fi

      - name: Patch version strings
        working-directory: kernel
        env:
          FAKE: "5.15.205"
          DISP: "4.19.325-Oblivionis"
        run: |
          VER="${DISP%%-*}"
          SUF="${DISP#*-}"
          V="${VER%%.*}"
          R="${VER#*.}"
          P="${R%%.*}"
          S="${R#*.}"
          sed -i "s/^VERSION =.*/VERSION = $V/" Makefile
          sed -i "s/^PATCHLEVEL =.*/PATCHLEVEL = $P/" Makefile
          sed -i "s/^SUBLEVEL =.*/SUBLEVEL = $S/" Makefile
          sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = -$SUF/" Makefile
          sed -i "s/^NAME =.*/NAME = Oblivionis/" Makefile
          FAKE="$FAKE" python3 -c "import pathlib,os;fake=os.environ['FAKE'];p=pathlib.Path('kernel/sys.c');s=p.read_text();needle='memcpy(&tmp, utsname(), sizeof(tmp));';rel='strncpy(tmp.release, \"'+fake+'\", sizeof(tmp.release)-1);';ver='strncpy(tmp.version, \"'+fake+'-Oblivionis\", sizeof(tmp.version)-1);';s=s.replace(needle,needle+' '+rel+' '+ver) if rel not in s else s;p.write_text(s);print('uname patched')"

      - name: Configure kernel
        working-directory: kernel
        run: |
          export PATH="${TOOLCHAINS_DIR}/clang/bin:$PATH"
          mkdir -p "${OUT_DIR}"
          make O="${OUT_DIR}" ARCH=${ARCH} CC=clang vendor/kona-perf_defconfig
          if [ -f arch/arm64/configs/vendor/oplus.config ]; then
            ARCH=arm64 scripts/kconfig/merge_config.sh -m -O "${OUT_DIR}" "${OUT_DIR}/.config" arch/arm64/configs/vendor/oplus.config
          fi
          make O="${OUT_DIR}" ARCH=${ARCH} CC=clang olddefconfig
          scripts/config --file "${OUT_DIR}/.config" \
            -e BPF -e BPF_SYSCALL -e BPF_JIT -e BPF_JIT_ALWAYS_ON -e BPF_JIT_DEFAULT_ON \
            -e BPF_UNPRIV_DEFAULT_OFF -e BPF_EVENTS -e BPF_LSM -e HAVE_EBPF_JIT \
            -e CGROUP_BPF -e NET_CLS_BPF -e NET_ACT_BPF \
            -e DEBUG_INFO -e DEBUG_INFO_DWARF4 \
            -e SCHED_TUNE -e CPU_BOOST -e SCHED_WALT \
            -e UCLAMP_TASK -e UCLAMP_TASK_GROUP \
            -e PSI
          scripts/config --file "${OUT_DIR}/.config" -d DEBUG_INFO_BTF_MODULES
          scripts/config --file "${OUT_DIR}/.config" -d BPF_PRELOAD
          scripts/config --file "${OUT_DIR}/.config" -d KSU
          scripts/config --file "${OUT_DIR}/.config" --set-val FRAME_WARN 0
          make O="${OUT_DIR}" ARCH=${ARCH} CC=clang olddefconfig
          echo "=== config check ==="
          grep -E "CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|BPF_LSM|DEBUG_INFO_BTF|KSU|SCHED_TUNE|SCHED_WALT|UCLAMP|PSI|SIMPLE_LMK|SECURITY_BBG)=" "${OUT_DIR}/.config" || true

      - name: Build kernel
        working-directory: kernel
        env:
          CCACHE_MAXSIZE: 5G
          CCACHE_COMPRESS: "1"
        run: |
          export PATH="${TOOLCHAINS_DIR}/clang/bin:$PATH"
          mkdir -p "${CCACHE_DIR}"
          ccache -s || true
          set -o pipefail
          make -j$(nproc) O="${OUT_DIR}" ARCH=${ARCH} \
            CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${TOOLCHAINS_DIR}/gcc-arm64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="${TOOLCHAINS_DIR}/gcc-arm32/bin/arm-linux-androideabi-" \
            2>&1 | tee build.log
          ccache -s || true

      - name: Package with AnyKernel3
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3

          cat > ak3/anykernel.sh <<'AK3'
### AnyKernel3 Ramdisk Mod Script
## osm0sis @ xda-developers

properties() { '
kernel.string=Oblivionis Kernel (4.19.325)
do.devicecheck=1
do.modules=0
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.name1=lemonades
device.name2=OnePlus 9R
device.name3=OnePlus9R
device.name4=
device.name5=
supported.versions=
supported.patchlevels=
supported.vendorpatchlevels=
'; }

boot_attributes() {
set_perm_recursive 0 0 755 644 $RAMDISK/*;
set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
}

BLOCK=boot;
IS_SLOT_DEVICE=1;
RAMDISK_COMPRESSION=auto;
PATCH_VBMETA_FLAG=auto;

. tools/ak3-core.sh;

dump_boot;
write_boot;
AK3

          B="${OUT_DIR}/arch/arm64/boot"
          ls -la "$B/" 2>/dev/null || true
          if [ -f "$B/Image.gz-dtb" ]; then cp "$B/Image.gz-dtb" ak3/
          elif [ -f "$B/Image.gz" ]; then cp "$B/Image.gz" ak3/
          elif [ -f "$B/Image" ]; then cp "$B/Image" ak3/
          else echo "::error::no Image found"; exit 1; fi
          cd ak3
          ZIP="${ZIP_PREFIX}-4.19-lemonades-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIP" . -x ".git/*"
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Upload kernel zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_PREFIX }}-${{ github.run_number }}
          path: ${{ env.ZIP }}
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_number }}
          path: kernel/build.log
          retention-days: 7
