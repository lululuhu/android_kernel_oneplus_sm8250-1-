name: Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'defconfig name'
        required: true
        default: 'kona-perf_defconfig'
      fake_uname:
        description: 'fake uname version'
        required: true
        default: '5.15.205'
      display_version:
        description: 'kernel banner version'
        required: true
        default: '4.19.325-Oblivionis'
      susfs_variant:
        description: 'susfs-main / susfs-stable / main'
        required: true
        default: 'susfs-main'
      apply_patches:
        description: 'true or false'
        required: true
        default: 'true'
      merge_oplus:
        description: 'true or false'
        required: true
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          path: kernel

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip \
            imagemagick cpio device-tree-compiler libelf-dev dwarves

      - name: Toolchains
        run: |
          mkdir -p ${{ github.workspace }}/toolchains
          cd ${{ github.workspace }}/toolchains
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-arm64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm32

      - name: Apply patches
        working-directory: kernel
        run: |
          git config user.email ci@local
          git config user.name CI
          shopt -s nullglob
          P=(../patches/*.patch)
          if [ ${#P[@]} -eq 0 ]; then echo "no patches"; exit 0; fi
          for p in "${P[@]}"; do
            echo "applying $p"
            git apply --3way --whitespace=nowarn "$p"
          done

      - name: Patch version
        working-directory: kernel
        env:
          FAKE: ${{ github.event.inputs.fake_uname }}
          DISP: ${{ github.event.inputs.display_version }}
        run: |
          VER="${DISP%%-*}"
          SUF="${DISP#*-}"
          V="${VER%%.*}"
          R="${VER#*.}"
          P="${R%%.*}"
          S="${R#*.}"
          sed -i "s/^VERSION =.*/VERSION = $V/" Makefile
          sed -i "s/^PATCHLEVEL =.*/PATCHLEVEL = $P/" Makefile
          sed -i "s/^SUBLEVEL =.*/SUBLEVEL = $S/" Makefile
          sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = -$SUF/" Makefile
          sed -i "s/^NAME =.*/NAME = Oblivionis/" Makefile
          python3 - <<PY
          import pathlib
          p = pathlib.Path("kernel/sys.c")
          s = p.read_text()
          rel = 'strncpy(tmp.release, "${FAKE}", sizeof(tmp.release)-1);'
          ver = 'strncpy(tmp.version, "${FAKE}-Oblivionis", sizeof(tmp.version)-1);'
          if rel not in s:
              n = "memcpy(&tmp, utsname(), sizeof(tmp));"
              s = s.replace(n, n + " " + rel + " " + ver)
              p.write_text(s)
              print("patched uname")
          PY

      - name: SukiSU
        working-directory: kernel
        continue-on-error: true
        run: |
          curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s "${{ github.event.inputs.susfs_variant }}" || true

      - name: Configure
        working-directory: kernel
        env:
          DEFCONFIG: ${{ github.event.inputs.defconfig }}
          OPLUS: ${{ github.event.inputs.merge_oplus }}
        run: |
          export ARCH=arm64
          export PATH="${{ github.workspace }}/toolchains/clang/bin:$PATH"
          mkdir -p out
          CFG="arch/arm64/configs/vendor/${DEFCONFIG}"
          if [ ! -f "$CFG" ]; then CFG="arch/arm64/configs/${DEFCONFIG}"; fi
          echo "using $CFG"
          make O=out ARCH=arm64 CC=clang "$CFG"
          if [ "$OPLUS" = "true" ] && [ -f arch/arm64/configs/vendor/oplus.config ]; then
            ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/oplus.config
          fi
          cat >> out/.config <<'EOF'
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_BPF_JIT_DEFAULT_ON=y
          CONFIG_BPF_UNPRIV_DEFAULT_OFF=y
          CONFIG_BPF_EVENTS=y
          CONFIG_BPF_LSM=y
          CONFIG_BPF_PRELOAD=y
          CONFIG_HAVE_EBPF_JIT=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_DEBUG_INFO=y
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_DEBUG_INFO_BTF_MODULES=y
          CONFIG_DEBUG_INFO_DWARF4=y
          CONFIG_FRAME_WARN=0
          EOF
          make O=out ARCH=arm64 CC=clang olddefconfig

      - name: Build
        working-directory: kernel
        run: |
          export ARCH=arm64
          export PATH="${{ github.workspace }}/toolchains/clang/bin:$PATH"
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=${{ github.workspace }}/toolchains/gcc-arm64/bin/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=${{ github.workspace }}/toolchains/gcc-arm32/bin/arm-linux-androideabi- \
            2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then tail -100 build.log; exit 1; fi

      - name: AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          sed -i 's/^device.name1=.*/device.name1=lemonades/' ak3/anykernel.sh
          B=kernel/out/arch/arm64/boot
          if [ -f "$B/Image.gz-dtb" ]; then cp "$B/Image.gz-dtb" ak3/
          elif [ -f "$B/Image.gz" ]; then cp "$B/Image.gz" ak3/
          else cp "$B/Image" ak3/; fi
          cd ak3
          ZIP="Oblivionis-4.19-lemonades-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIP" . -x ".git/*"
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Oblivionis-${{ github.run_number }}
          path: ${{ env.ZIP }}
          retention-days: 30

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_number }}
          path: kernel/build.log
          retention-days: 7
