name: Build Oblivionis Kernel

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      ARCH: arm64
      TOOLCHAINS_DIR: ${{ github.workspace }}/toolchains
      OUT_DIR: ${{ github.workspace }}/kernel/out
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      ZIP_PREFIX: Oblivionis
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          path: kernel

      - name: Verify 5.10 BPF present
        working-directory: kernel
        run: |
          for f in ringbuf.c trampoline.c btf.c bpf_iter.c local_storage.c bpf_lsm.c; do
            if [ -f "bpf/$f" ]; then echo "OK      kernel/bpf/$f"; else echo "MISSING kernel/bpf/$f"; fi
          done
          ls -la security/bpf/ 2>/dev/null || echo "MISSING security/bpf/"

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref }}-
            ${{ runner.os }}-ccache-

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip unzip zlib1g-dev python3 python3-pip imagemagick \
            cpio device-tree-compiler libelf-dev dwarves zstd
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install toolchains
        run: |
          mkdir -p "${TOOLCHAINS_DIR}"
          cd "${TOOLCHAINS_DIR}"
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-arm64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm32

      - name: Apply patches
        working-directory: kernel
        run: |
          git config user.email ci@local
          git config user.name CI
          shopt -s nullglob
          P=(patches/*.patch)
          if [ ${#P[@]} -eq 0 ]; then echo "no patches"; exit 0; fi
          for p in "${P[@]}"; do
            echo "applying $p"
            if ! git apply --3way --whitespace=nowarn "$p"; then
              echo "::error::patch failed: $p"
              exit 1
            fi
          done

      - name: Integrate SukiSU-Ultra (susfs-main)
        working-directory: kernel
        continue-on-error: true
        run: |
          curl -fsSL https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s susfs-main || true
          if [ ! -d drivers/kernelsu ]; then
            git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git /tmp/ksu || true
            if [ -d /tmp/ksu/kernel ]; then cp -r /tmp/ksu/kernel drivers/kernelsu; fi
          fi
          ls -la drivers/kernelsu/ 2>/dev/null || echo "still missing"

      - name: Fix KernelSU compat for 4.19
        working-directory: kernel
        run: |
          echo "=== MODULE_IMPORT_NS (source) ==="
          find drivers/kernelsu -type f \( -name '*.c' -o -name '*.h' \) -print0 2>/dev/null | xargs -0 -r sed -i '/MODULE_IMPORT_NS/d'

          echo "=== MODULE_IMPORT_NS (header fallback) ==="
          if ! grep -q "MODULE_IMPORT_NS_COMPAT_4_19" include/linux/module.h; then
            printf '\n/* 4.19 compat */\n#ifndef MODULE_IMPORT_NS\n#define MODULE_IMPORT_NS(x)\n#define MODULE_IMPORT_NS_COMPAT_4_19 1\n#endif\n' >> include/linux/module.h
          fi

          echo "=== Fix file_wrapper.c ==="
          FW=drivers/kernelsu/infra/file_wrapper.c
          if [ -f "$FW" ]; then
            cp "$FW" "$FW.orig"
            sed -i 's|return orig->f_op->iopoll(kiocb, spin);|return 0;|g' "$FW"
            sed -i 's|p->ops.iopoll = fp->f_op->iopoll ? ksu_wrapper_iopoll : NULL;|/* iopoll disabled on 4.19 */|g' "$FW"
            sed -i 's|if (remap_flags & REMAP_FILE_DEDUP) {|if (0) {|g' "$FW"
            sed -i 's|return orig->f_op->remap_file_range(file_in, pos_in, orig, pos_out, len, remap_flags);|return -EINVAL;|g' "$FW"
            sed -i 's|return orig->f_op->remap_file_range(orig, pos_in, file_out, pos_out, len, remap_flags);|return -EINVAL;|g' "$FW"
            sed -i 's|p->ops.remap_file_range = fp->f_op->remap_file_range ? ksu_wrapper_remap_file_range : NULL;|/* remap_file_range disabled on 4.19 */|g' "$FW"
            sed -i 's|struct file \*orig = data->orig;|struct file *orig __attribute__((unused)) = data->orig;|g' "$FW"
          fi

          echo "=== Fix seccomp_cache.c ==="
          SC=drivers/kernelsu/infra/seccomp_cache.c
          if [ -f "$SC" ] && ! grep -q "SECCOMP_ARCH_NATIVE_NR_COMPAT" "$SC"; then
            cp "$SC" "$SC.orig"
            printf '/* 4.19 compat */\n#ifndef SECCOMP_ARCH_NATIVE_NR\n#define SECCOMP_ARCH_NATIVE_NR 512\n#define SECCOMP_ARCH_NATIVE_NR_COMPAT 1\n#endif\n' > /tmp/sc_head
            cat /tmp/sc_head "$SC.orig" > "$SC"
          fi

          echo "=== Fix ALL allowlist.c files (find all paths) ==="
          find drivers/kernelsu -name 'allowlist.c' -print0 | while IFS= read -r -d '' AL; do
            if [ -f "$AL" ] && ! grep -q "TWA_RESUME_COMPAT_4_19" "$AL"; then
              cp "$AL" "$AL.orig"
              printf '/* 4.19 compat: TWA_RESUME (enum->bool) + put_task_struct */\n#include <linux/sched/task.h>\n#ifndef TWA_RESUME\n#define TWA_RESUME true\n#define TWA_RESUME_COMPAT_4_19 1\n#endif\n' > /tmp/al_head
              cat /tmp/al_head "$AL.orig" > "$AL"
              echo "patched: $AL"
            else
              echo "skip (already patched or missing): $AL"
            fi
          done

          echo "=== Fix pkg_observer.c ==="
          PO=drivers/kernelsu/manager/pkg_observer.c
          if [ -f "$PO" ]; then
            cp "$PO" "$PO.orig"
            sed -i 's|\.handle_inode_event = ksu_handle_inode_event,|/* .handle_inode_event removed for 4.19 compat */|' "$PO"
            sed -i 's|int ksu_handle_inode_event(|int __attribute__((unused)) ksu_handle_inode_event(|' "$PO"
          fi

          echo "=== Create uapi/linux/mount.h shim ==="
          mkdir -p include/uapi/linux
          if [ ! -f include/uapi/linux/mount.h ]; then
            echo '/* 4.19 shim */' > include/uapi/linux/mount.h
            echo '#ifndef _UAPI_LINUX_MOUNT_H' >> include/uapi/linux/mount.h
            echo '#define _UAPI_LINUX_MOUNT_H' >> include/uapi/linux/mount.h
            echo '#include <linux/types.h>' >> include/uapi/linux/mount.h
            echo '#include <uapi/linux/fs.h>' >> include/uapi/linux/mount.h
            echo '#ifndef MS_NOSYMFOLLOW' >> include/uapi/linux/mount.h
            echo '#define MS_NOSYMFOLLOW 256' >> include/uapi/linux/mount.h
            echo '#endif' >> include/uapi/linux/mount.h
            echo '#ifndef MOUNT_ATTR_RDONLY' >> include/uapi/linux/mount.h
            echo '#define MOUNT_ATTR_RDONLY 0x00000001' >> include/uapi/linux/mount.h
            echo '#endif' >> include/uapi/linux/mount.h
            echo '#ifndef MOUNT_ATTR_NOSUID' >> include/uapi/linux/mount.h
            echo '#define MOUNT_ATTR_NOSUID 0x00000002' >> include/uapi/linux/mount.h
            echo '#endif' >> include/uapi/linux/mount.h
            echo '#ifndef MOUNT_ATTR_NODEV' >> include/uapi/linux/mount.h
            echo '#define MOUNT_ATTR_NODEV 0x00000004' >> include/uapi/linux/mount.h
            echo '#endif' >> include/uapi/linux/mount.h
            echo '#ifndef MOUNT_ATTR_NOEXEC' >> include/uapi/linux/mount.h
            echo '#define MOUNT_ATTR_NOEXEC 0x00000008' >> include/uapi/linux/mount.h
            echo '#endif' >> include/uapi/linux/mount.h
            echo '#ifndef MOUNT_ATTR_NOATIME' >> include/uapi/linux/mount.h
            echo '#define MOUNT_ATTR_NOATIME 0x00000010' >> include/uapi/linux/mount.h
            echo '#endif' >> include/uapi/linux/mount.h
            echo '#ifndef MOUNT_ATTR_STRICTATIME' >> include/uapi/linux/mount.h
            echo '#define MOUNT_ATTR_STRICTATIME 0x00000020' >> include/uapi/linux/mount.h
            echo '#endif' >> include/uapi/linux/mount.h
            echo '#ifndef MOUNT_ATTR_RELATIME' >> include/uapi/linux/mount.h
            echo '#define MOUNT_ATTR_RELATIME 0x00000000' >> include/uapi/linux/mount.h
            echo '#endif' >> include/uapi/linux/mount.h
            echo '#ifndef MOUNT_ATTR_NODIRATIME' >> include/uapi/linux/mount.h
            echo '#define MOUNT_ATTR_NODIRATIME 0x00000080' >> include/uapi/linux/mount.h
            echo '#endif' >> include/uapi/linux/mount.h
            echo '#ifndef MOUNT_ATTR__ATIME' >> include/uapi/linux/mount.h
            echo '#define MOUNT_ATTR__ATIME 0x00000070' >> include/uapi/linux/mount.h
            echo '#endif' >> include/uapi/linux/mount.h
            echo '#endif' >> include/uapi/linux/mount.h
          fi

          echo "=== check TWA_RESUME status in all allowlist.c ==="
          find drivers/kernelsu -name 'allowlist.c' -exec grep -l "TWA_RESUME_COMPAT_4_19" {} \;

      - name: Patch version strings
        working-directory: kernel
        env:
          FAKE: "5.15.205"
          DISP: "4.19.325-Oblivionis"
        run: |
          VER="${DISP%%-*}"
          SUF="${DISP#*-}"
          V="${VER%%.*}"
          R="${VER#*.}"
          P="${R%%.*}"
          S="${R#*.}"
          sed -i "s/^VERSION =.*/VERSION = $V/" Makefile
          sed -i "s/^PATCHLEVEL =.*/PATCHLEVEL = $P/" Makefile
          sed -i "s/^SUBLEVEL =.*/SUBLEVEL = $S/" Makefile
          sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = -$SUF/" Makefile
          sed -i "s/^NAME =.*/NAME = Oblivionis/" Makefile
          FAKE="$FAKE" python3 -c "import pathlib,os;fake=os.environ['FAKE'];p=pathlib.Path('kernel/sys.c');s=p.read_text();needle='memcpy(&tmp, utsname(), sizeof(tmp));';rel='strncpy(tmp.release, \"'+fake+'\", sizeof(tmp.release)-1);';ver='strncpy(tmp.version, \"'+fake+'-Oblivionis\", sizeof(tmp.version)-1);';s=s.replace(needle,needle+' '+rel+' '+ver) if rel not in s else s;p.write_text(s);print('uname patched')"

      - name: Configure kernel
        working-directory: kernel
        run: |
          export PATH="${TOOLCHAINS_DIR}/clang/bin:$PATH"
          mkdir -p "${OUT_DIR}"
          make O="${OUT_DIR}" ARCH=${ARCH} CC=clang vendor/kona-perf_defconfig
          if [ -f arch/arm64/configs/vendor/oplus.config ]; then
            ARCH=arm64 scripts/kconfig/merge_config.sh -m -O "${OUT_DIR}" "${OUT_DIR}/.config" arch/arm64/configs/vendor/oplus.config
          fi
          make O="${OUT_DIR}" ARCH=${ARCH} CC=clang olddefconfig
          scripts/config --file "${OUT_DIR}/.config" \
            -e BPF -e BPF_SYSCALL -e BPF_JIT -e BPF_JIT_ALWAYS_ON -e BPF_JIT_DEFAULT_ON \
            -e BPF_UNPRIV_DEFAULT_OFF -e BPF_EVENTS -e BPF_LSM -e HAVE_EBPF_JIT \
            -e CGROUP_BPF -e NET_CLS_BPF -e NET_ACT_BPF \
            -e DEBUG_INFO -e DEBUG_INFO_DWARF4
          scripts/config --file "${OUT_DIR}/.config" -d DEBUG_INFO_BTF_MODULES
          scripts/config --file "${OUT_DIR}/.config" -d BPF_PRELOAD
          scripts/config --file "${OUT_DIR}/.config" --set-val FRAME_WARN 0
          make O="${OUT_DIR}" ARCH=${ARCH} CC=clang olddefconfig
          echo "=== config check ==="
          grep -E "CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|BPF_LSM|DEBUG_INFO_BTF|KSU)=" "${OUT_DIR}/.config" || true

      - name: Build kernel
        working-directory: kernel
        env:
          CCACHE_MAXSIZE: 5G
          CCACHE_COMPRESS: "1"
        run: |
          export PATH="${TOOLCHAINS_DIR}/clang/bin:$PATH"
          mkdir -p "${CCACHE_DIR}"
          ccache -s || true
          set -o pipefail
          make -j$(nproc) O="${OUT_DIR}" ARCH=${ARCH} \
            CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${TOOLCHAINS_DIR}/gcc-arm64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="${TOOLCHAINS_DIR}/gcc-arm32/bin/arm-linux-androideabi-" \
            2>&1 | tee build.log
          ccache -s || true

      - name: Package with AnyKernel3
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          sed -i 's/^#\?device\.name1=.*/device.name1=lemonades/' ak3/anykernel.sh
          sed -i 's/^#\?device\.name2=.*/device.name2=OnePlus 9R/' ak3/anykernel.sh
          sed -i 's/^#\?device\.name3=.*/device.name3=OnePlus9R/' ak3/anykernel.sh
          grep -q "^device.name1=" ak3/anykernel.sh || echo "device.name1=lemonades" >> ak3/anykernel.sh
          grep -q "^device.name2=" ak3/anykernel.sh || echo "device.name2=OnePlus 9R" >> ak3/anykernel.sh
          grep -q "^device.name3=" ak3/anykernel.sh || echo "device.name3=OnePlus9R" >> ak3/anykernel.sh
          B="${OUT_DIR}/arch/arm64/boot"
          ls -la "$B/" 2>/dev/null || true
          if [ -f "$B/Image.gz-dtb" ]; then cp "$B/Image.gz-dtb" ak3/
          elif [ -f "$B/Image.gz" ]; then cp "$B/Image.gz" ak3/
          elif [ -f "$B/Image" ]; then cp "$B/Image" ak3/
          else echo "::error::no Image found"; exit 1; fi
          cd ak3
          ZIP="${ZIP_PREFIX}-4.19-lemonades-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIP" . -x ".git/*"
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Upload kernel zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_PREFIX }}-${{ github.run_number }}
          path: ${{ env.ZIP }}
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_number }}
          path: kernel/build.log
          retention-days: 7
