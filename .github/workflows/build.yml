name: Build Oblivionis Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          path: kernel

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip imagemagick cpio device-tree-compiler libelf-dev dwarves

      - name: Install toolchains
        run: |
          mkdir -p ${{ github.workspace }}/toolchains
          cd ${{ github.workspace }}/toolchains
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-arm64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm32

      - name: Apply patches
        working-directory: kernel
        run: |
          git config user.email ci@local
          git config user.name CI
          shopt -s nullglob
          P=(../patches/*.patch)
          if [ ${#P[@]} -eq 0 ]; then echo "no patches"; exit 0; fi
          for p in "${P[@]}"; do
            echo "applying $p"
            if ! git apply --3way --whitespace=nowarn "$p"; then
              echo "::error::patch failed: $p"
              exit 1
            fi
          done

      - name: Patch version strings
        working-directory: kernel
        env:
          FAKE: "5.15.205"
          DISP: "4.19.325-Oblivionis"
        run: |
          VER="${DISP%%-*}"
          SUF="${DISP#*-}"
          V="${VER%%.*}"
          R="${VER#*.}"
          P="${R%%.*}"
          S="${R#*.}"
          sed -i "s/^VERSION =.*/VERSION = $V/" Makefile
          sed -i "s/^PATCHLEVEL =.*/PATCHLEVEL = $P/" Makefile
          sed -i "s/^SUBLEVEL =.*/SUBLEVEL = $S/" Makefile
          sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = -$SUF/" Makefile
          sed -i "s/^NAME =.*/NAME = Oblivionis/" Makefile
          FAKE="$FAKE" python3 -c "import pathlib,os;fake=os.environ['FAKE'];p=pathlib.Path('kernel/sys.c');s=p.read_text();needle='memcpy(&tmp, utsname(), sizeof(tmp));';rel='strncpy(tmp.release, \"'+fake+'\", sizeof(tmp.release)-1);';ver='strncpy(tmp.version, \"'+fake+'-Oblivionis\", sizeof(tmp.version)-1);';s=s.replace(needle,needle+' '+rel+' '+ver) if rel not in s else s;p.write_text(s);print('uname patched')"

      - name: Integrate SukiSU-Ultra
        working-directory: kernel
        continue-on-error: true
        run: |
          curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s susfs-main || true
          if [ ! -d drivers/kernelsu ]; then
            echo "kernelsu dir not found, trying fallback clone"
            git clone --depth=1 https://github.com/tiann/KernelSU.git /tmp/ksu || true
            if [ -d /tmp/ksu/kernel ]; then
              cp -r /tmp/ksu/kernel drivers/kernelsu
            fi
          fi
          echo "=== kernelsu dir check ==="
          ls -la drivers/kernelsu/ 2>/dev/null || echo "still missing"

      - name: Fix KernelSU MODULE_IMPORT_NS
        working-directory: kernel
        run: |
          echo "=== before ==="
          grep -rn "MODULE_IMPORT_NS" drivers/kernelsu/ 2>/dev/null || echo "not found"
          find drivers/kernelsu -name '*.c' -print0 2>/dev/null | xargs -0 -r sed -i '/MODULE_IMPORT_NS(/d'
          echo "=== after ==="
          grep -rn "MODULE_IMPORT_NS" drivers/kernelsu/ 2>/dev/null || echo "all removed"

      - name: Configure kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export PATH="${{ github.workspace }}/toolchains/clang/bin:$PATH"
          mkdir -p out
          make O=out ARCH=arm64 CC=clang vendor/kona-perf_defconfig
          if [ -f arch/arm64/configs/vendor/oplus.config ]; then
            ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/oplus.config
          fi
          make O=out ARCH=arm64 CC=clang olddefconfig
          scripts/config --file out/.config -e BPF -e BPF_SYSCALL -e BPF_JIT -e BPF_JIT_ALWAYS_ON -e BPF_JIT_DEFAULT_ON -e BPF_UNPRIV_DEFAULT_OFF -e BPF_EVENTS -e BPF_LSM -e HAVE_EBPF_JIT -e CGROUP_BPF -e NET_CLS_BPF -e NET_ACT_BPF -e DEBUG_INFO -e DEBUG_INFO_DWARF4
          scripts/config --file out/.config -d DEBUG_INFO_BTF_MODULES
          scripts/config --file out/.config -d BPF_PRELOAD
          scripts/config --file out/.config --set-val FRAME_WARN 0
          make O=out ARCH=arm64 CC=clang olddefconfig
          echo "=== config check ==="
          grep -E "CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|BPF_LSM|DEBUG_INFO_BTF|BPF_PRELOAD)=" out/.config || true
          touch kernel/bpf/preload/bpf_preload_umd 2>/dev/null || true
          mkdir -p out/kernel/bpf/preload
          touch out/kernel/bpf/preload/bpf_preload_umd 2>/dev/null || true

      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export PATH="${{ github.workspace }}/toolchains/clang/bin:$PATH"
          set -o pipefail
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=${{ github.workspace }}/toolchains/gcc-arm64/bin/aarch64-linux-android- CROSS_COMPILE_ARM32=${{ github.workspace }}/toolchains/gcc-arm32/bin/arm-linux-androideabi- 2>&1 | tee build.log

      - name: Package with AnyKernel3
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          sed -i 's/^#\?device\.name1=.*/device.name1=lemonades/' ak3/anykernel.sh
          sed -i 's/^#\?device\.name2=.*/device.name2=OnePlus 9R/' ak3/anykernel.sh
          sed -i 's/^#\?device\.name3=.*/device.name3=OnePlus9R/' ak3/anykernel.sh
          grep -q "^device.name1=" ak3/anykernel.sh || echo "device.name1=lemonades" >> ak3/anykernel.sh
          grep -q "^device.name2=" ak3/anykernel.sh || echo "device.name2=OnePlus 9R" >> ak3/anykernel.sh
          grep -q "^device.name3=" ak3/anykernel.sh || echo "device.name3=OnePlus9R" >> ak3/anykernel.sh
          echo "=== device lines ==="
          grep "^device.name" ak3/anykernel.sh
          B=kernel/out/arch/arm64/boot
          if [ -f "$B/Image.gz-dtb" ]; then cp "$B/Image.gz-dtb" ak3/
          elif [ -f "$B/Image.gz" ]; then cp "$B/Image.gz" ak3/
          else cp "$B/Image" ak3/; fi
          cd ak3
          ZIP="Oblivionis-4.19-lemonades-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIP" . -x ".git/*"
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Upload kernel zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Oblivionis-${{ github.run_number }}
          path: ${{ env.ZIP }}
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_number }}
          path: kernel/build.log
          retention-days: 7
