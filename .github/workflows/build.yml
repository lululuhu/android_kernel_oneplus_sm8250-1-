name: Build Oblivionis Kernel

on:
  workflow_dispatch:
    inputs:
      base_img_url:
        description: 'Optional URL to boot_base.img (will be downloaded into kernel/bootimg/boot_base.img)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      ARCH: arm64
      TOOLCHAINS_DIR: ${{ github.workspace }}/toolchains
      OUT_DIR: ${{ github.workspace }}/kernel/out
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          path: kernel

      - name: Fetch base image (optional URL)
        run: |
          if [ -n "${{ github.event.inputs.base_img_url }}" ]; then
            mkdir -p kernel/bootimg
            curl -fsSL "${{ github.event.inputs.base_img_url }}" -o kernel/bootimg/boot_base.img
            echo "Downloaded base image from workflow input"
          fi

      - name: Check for boot base image
        working-directory: kernel
        run: |
          if [ -f bootimg/boot_base.img ]; then
            echo "Found boot_base.img"
            ls -la bootimg/boot_base.img
            file bootimg/boot_base.img
            echo "BOOT_PRESENT=1" >> $GITHUB_ENV
          else
            echo "::warning::bootimg/boot_base.img not found"
            echo "::warning::Will compile kernel only and upload raw Image.gz-dtb"
            echo "BOOT_PRESENT=0" >> $GITHUB_ENV
          fi

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref }}-
            ${{ runner.os }}-ccache-

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip unzip zlib1g-dev python3 python3-pip imagemagick \
            cpio device-tree-compiler libelf-dev dwarves zstd lz4
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install toolchains
        run: |
          mkdir -p "${TOOLCHAINS_DIR}"
          cd "${TOOLCHAINS_DIR}"
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-arm64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm32

      - name: Install magiskboot
        if: ${{ env.BOOT_PRESENT == '1' }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/magiskboot_bin"
          cd "${GITHUB_WORKSPACE}/magiskboot_bin"
          curl -fL "https://raw.githubusercontent.com/miaizhe/magiskboot-linux/main/x86_64/magiskboot" -o magiskboot
          chmod +x magiskboot
          ./magiskboot 2>&1 | head -5 || true

      - name: Apply patches
        working-directory: kernel
        run: |
          git config user.email ci@local
          git config user.name CI
          shopt -s nullglob
          P=(patches/*.patch)
          if [ ${#P[@]} -eq 0 ]; then echo "no patches"; exit 0; fi
          for p in "${P[@]}"; do
            echo "applying $p"
            if ! git apply --3way --whitespace=nowarn "$p"; then
              echo "::error::patch failed: $p"
              exit 1
            fi
          done

      - name: Patch version strings
        working-directory: kernel
        env:
          FAKE: "5.15.205"
          DISP: "4.19.325-Oblivionis"
        run: |
          VER="${DISP%%-*}"
          SUF="${DISP#*-}"
          V="${VER%%.*}"
          R="${VER#*.}"
          P="${R%%.*}"
          S="${R#*.}"
          sed -i "s/^VERSION =.*/VERSION = $V/" Makefile
          sed -i "s/^PATCHLEVEL =.*/PATCHLEVEL = $P/" Makefile
          sed -i "s/^SUBLEVEL =.*/SUBLEVEL = $S/" Makefile
          sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = -$SUF/" Makefile
          sed -i "s/^NAME =.*/NAME = Oblivionis/" Makefile
          FAKE="$FAKE" python3 -c "import pathlib,os;fake=os.environ['FAKE'];p=pathlib.Path('kernel/sys.c');s=p.read_text();needle='memcpy(&tmp, utsname(), sizeof(tmp));';rel='strncpy(tmp.release, \"'+fake+'\", sizeof(tmp.release)-1);';ver='strncpy(tmp.version, \"'+fake+'-Oblivionis\", sizeof(tmp.version)-1);';s=s.replace(needle,needle+' '+rel+' '+ver) if rel not in s else s;p.write_text(s);print('uname patched')"

      - name: Configure kernel
        working-directory: kernel
        run: |
          export PATH="${TOOLCHAINS_DIR}/clang/bin:$PATH"
          mkdir -p "${OUT_DIR}"
          make O="${OUT_DIR}" ARCH=${ARCH} CC=clang vendor/kona-perf_defconfig
          if [ -f arch/arm64/configs/vendor/oplus.config ]; then
            ARCH=arm64 scripts/kconfig/merge_config.sh -m -O "${OUT_DIR}" "${OUT_DIR}/.config" arch/arm64/configs/vendor/oplus.config
          fi
          make O="${OUT_DIR}" ARCH=${ARCH} CC=clang olddefconfig
          scripts/config --file "${OUT_DIR}/.config" \
            -e BPF -e BPF_SYSCALL -e BPF_JIT -e BPF_JIT_ALWAYS_ON -e BPF_JIT_DEFAULT_ON \
            -e BPF_UNPRIV_DEFAULT_OFF -e BPF_EVENTS -e BPF_LSM -e HAVE_EBPF_JIT \
            -e CGROUP_BPF -e NET_CLS_BPF -e NET_ACT_BPF \
            -e DEBUG_INFO -e DEBUG_INFO_DWARF4
          scripts/config --file "${OUT_DIR}/.config" -d DEBUG_INFO_BTF_MODULES
          scripts/config --file "${OUT_DIR}/.config" -d BPF_PRELOAD
          scripts/config --file "${OUT_DIR}/.config" -d KSU
          scripts/config --file "${OUT_DIR}/.config" --set-val FRAME_WARN 0
          make O="${OUT_DIR}" ARCH=${ARCH} CC=clang olddefconfig
          grep -E "CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|BPF_LSM|DEBUG_INFO_BTF|KSU)=" "${OUT_DIR}/.config" || true

      - name: Build kernel
        working-directory: kernel
        env:
          CCACHE_MAXSIZE: 5G
          CCACHE_COMPRESS: "1"
        run: |
          export PATH="${TOOLCHAINS_DIR}/clang/bin:$PATH"
          mkdir -p "${CCACHE_DIR}"
          ccache -s || true
          set -o pipefail
          make -j$(nproc) O="${OUT_DIR}" ARCH=${ARCH} \
            CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${TOOLCHAINS_DIR}/gcc-arm64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="${TOOLCHAINS_DIR}/gcc-arm32/bin/arm-linux-androideabi-" \
            2>&1 | tee build.log
          ccache -s || true

      - name: Show raw kernel artifacts
        if: success()
        run: |
          B="${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot"
          ls -la "$B/"
          echo "=== Image formats ==="
          for f in Image Image.gz Image.gz-dtb; do
            if [ -f "$B/$f" ]; then echo "$f:"; file "$B/$f"; fi
          done

      - name: Pack boot.img with magiskboot
        if: ${{ env.BOOT_PRESENT == '1' && success() }}
        run: |
          set -e
          MB="${GITHUB_WORKSPACE}/magiskboot_bin/magiskboot"
          BOOT_DIR="${GITHUB_WORKSPACE}/boot_pack"
          mkdir -p "$BOOT_DIR"
          cd "$BOOT_DIR"
          cp "${GITHUB_WORKSPACE}/kernel/bootimg/boot_base.img" boot_origin.img

          echo "=== unpack original boot ==="
          "$MB" unpack boot_origin.img
          ls -la

          KERNEL_IMG="${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$KERNEL_IMG" ]; then
            KERNEL_IMG="${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/Image.gz"
          fi
          if [ ! -f "$KERNEL_IMG" ]; then
            KERNEL_IMG="${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/Image"
          fi
          echo "=== using kernel: $KERNEL_IMG ==="
          ls -la "$KERNEL_IMG"

          echo "=== original kernel format ==="
          file kernel

          echo "=== replacing kernel ==="
          case "$(file -b kernel)" in
            *gzip*) gzip -c "$KERNEL_IMG" > kernel.new ;;
            *LZ4*) lz4 -l -12 "$KERNEL_IMG" kernel.new ;;
            *) cp "$KERNEL_IMG" kernel.new ;;
          esac
          mv kernel.new kernel

          echo "=== repack ==="
          IMG_NAME="Oblivionis-4.19-lemonades-$(date +%Y%m%d-%H%M).img"
          "$MB" repack boot_origin.img "${GITHUB_WORKSPACE}/$IMG_NAME"
          ls -la "${GITHUB_WORKSPACE}"/*.img
          echo "OUTPUT_IMG=$IMG_NAME" >> $GITHUB_ENV

      - name: Upload boot image
        if: ${{ env.BOOT_PRESENT == '1' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: Oblivionis-img-${{ github.run_number }}
          path: ${{ env.OUTPUT_IMG }}
          retention-days: 30

      - name: Upload raw kernel (fallback)
        if: ${{ env.BOOT_PRESENT == '0' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: Oblivionis-raw-${{ github.run_number }}
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_number }}
          path: kernel/build.log
          retention-days: 7
