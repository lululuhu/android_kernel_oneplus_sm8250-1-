name: Build Kernel (OnePlus 9R / lemonades)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig name'
        required: true
        default: 'kona-perf_defconfig'
      fake_uname:
        description: 'Fake uname version for BpfLoader'
        required: true
        default: '5.15.205'
      display_version:
        description: 'Kernel banner version'
        required: true
        default: '4.19.325-Oblivionis'
      susfs_variant:
        description: 'SukiSU-Ultra variant'
        required: true
        type: choice
        options:
          - susfs-main
          - susfs-stable
          - main
        default: susfs-main
      apply_patches:
        description: 'Apply patches from patches/'
        type: boolean
        default: true
      merge_oplus_fragment:
        description: 'Merge vendor/oplus.config'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/share/swift /usr/local/.ghcup
          sudo apt-get clean
          df -h

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          path: kernel

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python3-pip imagemagick cpio \
            device-tree-compiler libelf-dev dwarves

      - name: Install toolchains
        run: |
          mkdir -p ${{ github.workspace }}/toolchains
          cd ${{ github.workspace }}/toolchains
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc-arm64
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc-arm32

      - name: Apply patches
        if: ${{ github.event.inputs.apply_patches == 'true' }}
        working-directory: kernel
        run: |
          git config user.email "ci@local"
          git config user.name "CI"
          shopt -s nullglob
          PATCHES=(../patches/*.patch)
          if [ ${#PATCHES[@]} -eq 0 ]; then
            echo "patches/ empty, skip"
            exit 0
          fi
          for p in "${PATCHES[@]}"; do
            echo "applying $(basename $p)"
            git apply --3way --whitespace=nowarn "$p" || {
              echo "failed: $(basename $p)"
              exit 1
            }
          done
          echo "applied ${#PATCHES[@]} patches"

      - name: Patch kernel version strings
        working-directory: kernel
        env:
          FAKE: ${{ github.event.inputs.fake_uname }}
          DISP: ${{ github.event.inputs.display_version }}
        run: |
          set -e
          VER="${DISP%%-*}"
          SUF="${DISP#*-}"
          V="${VER%%.*}"
          REST="${VER#*.}"
          P="${REST%%.*}"
          S="${REST#*.}"

          sed -i "s/^VERSION *=.*/VERSION = $V/"               Makefile
          sed -i "s/^PATCHLEVEL *=.*/PATCHLEVEL = $P/"         Makefile
          sed -i "s/^SUBLEVEL *=.*/SUBLEVEL = $S/"             Makefile
          sed -i "s/^EXTRAVERSION *=.*/EXTRAVERSION = -$SUF/"  Makefile
          sed -i "s/^NAME *=.*/NAME = Oblivionis/"             Makefile

          python3 - <<PY
          import pathlib
          p = pathlib.Path("kernel/sys.c")
          s = p.read_text()
          fake = "${FAKE}"
          inject_release = 'strncpy(tmp.release, "%s", sizeof(tmp.release)-1);' % fake
          inject_version = 'strncpy(tmp.version, "%s-Oblivionis", sizeof(tmp.version)-1);' % fake

          if inject_release not in s:
              needle = "memcpy(&tmp, utsname(), sizeof(tmp));"
              count = s.count(needle)
              s = s.replace(needle, needle + " " + inject_release + " " + inject_version)
              p.write_text(s)
              print("patched %d uname() call sites -> %s" % (count, fake))
          else:
              print("already patched")
          PY

      - name: Integrate SukiSU-Ultra
        working-directory: kernel
        continue-on-error: true
        env:
          SUSFS_VARIANT: ${{ github.event.inputs.susfs_variant }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s "$SUSFS_VARIANT" || true

      - name: Configure kernel
        working-directory: kernel
        env:
          DEFCONFIG: ${{ github.event.inputs.defconfig }}
          MERGE_OPLUS: ${{ github.event.inputs.merge_oplus_fragment }}
        run: |
          export ARCH=arm64 SUBARCH=arm64
          export PATH="${{ github.workspace }}/toolchains/clang/bin:$PATH"
          mkdir -p out

          CFG="arch/arm64/configs/vendor/${DEFCONFIG}"
          [ ! -f "$CFG" ] && CFG="arch/arm64/configs/${DEFCONFIG}"
          make O=out ARCH=arm64 CC=clang "$CFG"

          if [ "$MERGE_OPLUS" = "true" ] && [ -f arch/arm64/configs/vendor/oplus.config ]; then
            ARCH=arm64 scripts/kconfig/merge_config.sh -m -O out \
              out/.config arch/arm64/configs/vendor/oplus.config
          fi

          cat >> out/.config <<'EOF'
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_BPF_JIT_ALWAYS_ON=y
CONFIG_BPF_JIT_DEFAULT_ON=y
CONFIG_BPF_UNPRIV_DEFAULT_OFF=y
CONFIG_BPF_EVENTS=y
CONFIG_BPF_LSM=y
CONFIG_BPF_PRELOAD=y
CONFIG_HAVE_EBPF_JIT=y
CONFIG_CGROUP_BPF=y
CONFIG_NET_CLS_BPF=y
CONFIG_NET_ACT_BPF=y
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_INFO_BTF=y
CONFIG_DEBUG_INFO_BTF_MODULES=y
CONFIG_DEBUG_INFO_DWARF4=y
CONFIG_FRAME_WARN=0
EOF
          make O=out ARCH=arm64 CC=clang olddefconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64 SUBARCH=arm64
          export PATH="${{ github.workspace }}/toolchains/clang/bin:$PATH"
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=${{ github.workspace }}/toolchains/gcc-arm64/bin/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=${{ github.workspace }}/toolchains/gcc-arm32/bin/arm-linux-androideabi- \
            2>&1 | tee build.log

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            tail -n 200 build.log
            exit 1
          fi

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3

          sed -i 's/^device.name1=.*/device.name1=lemonades/'  ak3/anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=OnePlus 9R/' ak3/anykernel.sh
          sed -i 's/^device.name3=.*/device.name3=OnePlus9R/'  ak3/anykernel.sh
          sed -i 's/^device.name4=.*/device.name4=lemonade/'   ak3/anykernel.sh
          sed -i 's/^device.name5=.*/device.name5=OnePlus 9/'  ak3/anykernel.sh

          BOOTDIR=kernel/out/arch/arm64/boot
          if   [ -f "$BOOTDIR/Image.gz-dtb" ]; then cp "$BOOTDIR/Image.gz-dtb" ak3/
          elif [ -f "$BOOTDIR/Image.gz"     ]; then cp "$BOOTDIR/Image.gz"     ak3/
          elif [ -f "$BOOTDIR/Image"        ]; then cp "$BOOTDIR/Image"        ak3/
          else ls -la "$BOOTDIR"; exit 1
          fi

          find "$BOOTDIR/dts" -name "*.dtb" -exec cp {} ak3/ \; 2>/dev/null || true

          cd ak3
          ZIP="Oblivionis-4.19-lemonades-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIP" . -x ".git/*" "*.zip"
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: Oblivionis-lemonades-${{ github.run_number }}
          path: ${{ env.ZIP }}
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          retention-days: 7
