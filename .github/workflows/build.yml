name: Build Oblivionis Kernel

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      ARCH: arm64
      TOOLCHAINS_DIR: ${{ github.workspace }}/toolchains
      OUT_DIR: ${{ github.workspace }}/kernel/out
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      ZIP_PREFIX: Oblivionis
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          path: kernel

      - name: Verify boot base image
        working-directory: kernel
        run: |
          if [ ! -f bootimg/boot_base.img ]; then
            echo "::error::bootimg/boot_base.img not found! Upload your working boot.img first."
            exit 1
          fi
          ls -la bootimg/boot_base.img
          file bootimg/boot_base.img

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref }}-
            ${{ runner.os }}-ccache-

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip unzip zlib1g-dev python3 python3-pip imagemagick \
            cpio device-tree-compiler libelf-dev dwarves zstd
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install toolchains
        run: |
          mkdir -p "${TOOLCHAINS_DIR}"
          cd "${TOOLCHAINS_DIR}"
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-arm64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm32

      - name: Install magiskboot
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/magiskboot_bin"
          cd "${GITHUB_WORKSPACE}/magiskboot_bin"
          curl -fL "https://raw.githubusercontent.com/miaizhe/magiskboot-linux/main/x86_64/magiskboot" -o magiskboot || {
            echo "::warning::failed to download magiskboot, will skip img packing"
          }
          chmod +x magiskboot || true
          ./magiskboot 2>&1 | head -5 || echo "magiskboot download failed"

      - name: Apply patches
        working-directory: kernel
        run: |
          git config user.email ci@local
          git config user.name CI
          shopt -s nullglob
          P=(patches/*.patch)
          if [ ${#P[@]} -eq 0 ]; then echo "no patches"; exit 0; fi
          for p in "${P[@]}"; do
            echo "applying $p"
            if ! git apply --3way --whitespace=nowarn "$p"; then
              echo "::error::patch failed: $p"
              exit 1
            fi
          done

      - name: Patch version strings
        working-directory: kernel
        env:
          FAKE: "5.15.205"
          DISP: "4.19.325-Oblivionis"
        run: |
          VER="${DISP%%-*}"
          SUF="${DISP#*-}"
          V="${VER%%.*}"
          R="${VER#*.}"
          P="${R%%.*}"
          S="${R#*.}"
          sed -i "s/^VERSION =.*/VERSION = $V/" Makefile
          sed -i "s/^PATCHLEVEL =.*/PATCHLEVEL = $P/" Makefile
          sed -i "s/^SUBLEVEL =.*/SUBLEVEL = $S/" Makefile
          sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = -$SUF/" Makefile
          sed -i "s/^NAME =.*/NAME = Oblivionis/" Makefile
          FAKE="$FAKE" python3 -c "import pathlib,os;fake=os.environ['FAKE'];p=pathlib.Path('kernel/sys.c');s=p.read_text();needle='memcpy(&tmp, utsname(), sizeof(tmp));';rel='strncpy(tmp.release, \"'+fake+'\", sizeof(tmp.release)-1);';ver='strncpy(tmp.version, \"'+fake+'-Oblivionis\", sizeof(tmp.version)-1);';s=s.replace(needle,needle+' '+rel+' '+ver) if rel not in s else s;p.write_text(s);print('uname patched')"

      - name: Configure kernel
        working-directory: kernel
        run: |
          export PATH="${TOOLCHAINS_DIR}/clang/bin:$PATH"
          mkdir -p "${OUT_DIR}"
          make O="${OUT_DIR}" ARCH=${ARCH} CC=clang vendor/kona-perf_defconfig
          if [ -f arch/arm64/configs/vendor/oplus.config ]; then
            ARCH=arm64 scripts/kconfig/merge_config.sh -m -O "${OUT_DIR}" "${OUT_DIR}/.config" arch/arm64/configs/vendor/oplus.config
          fi
          make O="${OUT_DIR}" ARCH=${ARCH} CC=clang olddefconfig
          scripts/config --file "${OUT_DIR}/.config" \
            -e BPF -e BPF_SYSCALL -e BPF_JIT -e BPF_JIT_ALWAYS_ON -e BPF_JIT_DEFAULT_ON \
            -e BPF_UNPRIV_DEFAULT_OFF -e BPF_EVENTS -e BPF_LSM -e HAVE_EBPF_JIT \
            -e CGROUP_BPF -e NET_CLS_BPF -e NET_ACT_BPF \
            -e DEBUG_INFO -e DEBUG_INFO_DWARF4
          scripts/config --file "${OUT_DIR}/.config" -d DEBUG_INFO_BTF_MODULES
          scripts/config --file "${OUT_DIR}/.config" -d BPF_PRELOAD
          scripts/config --file "${OUT_DIR}/.config" -d KSU
          scripts/config --file "${OUT_DIR}/.config" --set-val FRAME_WARN 0
          make O="${OUT_DIR}" ARCH=${ARCH} CC=clang olddefconfig
          grep -E "CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|BPF_LSM|DEBUG_INFO_BTF|KSU)=" "${OUT_DIR}/.config" || true

      - name: Build kernel
        working-directory: kernel
        env:
          CCACHE_MAXSIZE: 5G
          CCACHE_COMPRESS: "1"
        run: |
          export PATH="${TOOLCHAINS_DIR}/clang/bin:$PATH"
          mkdir -p "${CCACHE_DIR}"
          ccache -s || true
          set -o pipefail
          make -j$(nproc) O="${OUT_DIR}" ARCH=${ARCH} \
            CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${TOOLCHAINS_DIR}/gcc-arm64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="${TOOLCHAINS_DIR}/gcc-arm32/bin/arm-linux-androideabi-" \
            2>&1 | tee build.log
          ccache -s || true

      - name: Pack boot.img with magiskboot
        if: success()
        run: |
          set -e
          MB="${GITHUB_WORKSPACE}/magiskboot_bin/magiskboot"
          if [ ! -x "$MB" ]; then
            echo "::warning::magiskboot not available, skipping img packing"
            exit 0
          fi

          BOOT_DIR="${GITHUB_WORKSPACE}/boot_pack"
          mkdir -p "$BOOT_DIR"
          cd "$BOOT_DIR"
          cp "${GITHUB_WORKSPACE}/kernel/bootimg/boot_base.img" boot_origin.img

          "$MB" unpack boot_origin.img

          KERNEL_IMG="${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$KERNEL_IMG" ]; then
            KERNEL_IMG="${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/Image.gz"
          fi
          if [ ! -f "$KERNEL_IMG" ]; then
            KERNEL_IMG="${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/Image"
          fi
          echo "using kernel: $KERNEL_IMG"
          ls -la "$KERNEL_IMG"

          # 原 kernel 是什么格式
          file kernel
          # 替换
          cp "$KERNEL_IMG" kernel.new
          # 如果格式不同（原 kernel 可能是 lz4 / gzip），做转换
          case "$(file -b kernel)" in
            *gzip*) gzip -c "$KERNEL_IMG" > kernel.new ;;
            *LZ4*) lz4 -l -12 "$KERNEL_IMG" kernel.new 2>/dev/null || cp "$KERNEL_IMG" kernel.new ;;
            *) cp "$KERNEL_IMG" kernel.new ;;
          esac
          mv kernel.new kernel

          "$MB" repack boot_origin.img "${GITHUB_WORKSPACE}/Oblivionis-4.19-lemonades-$(date +%Y%m%d-%H%M).img"
          ls -la "${GITHUB_WORKSPACE}"/Oblivionis-*.img

      - name: Package with AnyKernel3 (backup)
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          printf '### AnyKernel3 Ramdisk Mod Script\n' > ak3/anykernel.sh
          printf '## osm0sis @ xda-developers\n\n' >> ak3/anykernel.sh
          printf "properties() { '\n" >> ak3/anykernel.sh
          printf 'kernel.string=Oblivionis Kernel (4.19.325)\n' >> ak3/anykernel.sh
          printf 'do.devicecheck=1\n' >> ak3/anykernel.sh
          printf 'do.modules=0\n' >> ak3/anykernel.sh
          printf 'do.systemless=1\n' >> ak3/anykernel.sh
          printf 'do.cleanup=1\n' >> ak3/anykernel.sh
          printf 'do.cleanuponabort=0\n' >> ak3/anykernel.sh
          printf 'device.name1=lemonades\n' >> ak3/anykernel.sh
          printf 'device.name2=OnePlus 9R\n' >> ak3/anykernel.sh
          printf 'device.name3=OnePlus9R\n' >> ak3/anykernel.sh
          printf 'device.name4=\n' >> ak3/anykernel.sh
          printf 'device.name5=\n' >> ak3/anykernel.sh
          printf 'supported.versions=\n' >> ak3/anykernel.sh
          printf 'supported.patchlevels=\n' >> ak3/anykernel.sh
          printf 'supported.vendorpatchlevels=\n' >> ak3/anykernel.sh
          printf "'; }\n\n" >> ak3/anykernel.sh
          printf 'boot_attributes() {\n' >> ak3/anykernel.sh
          printf 'set_perm_recursive 0 0 755 644 $RAMDISK/*;\n' >> ak3/anykernel.sh
          printf 'set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;\n' >> ak3/anykernel.sh
          printf '}\n\n' >> ak3/anykernel.sh
          printf 'BLOCK=boot;\n' >> ak3/anykernel.sh
          printf 'IS_SLOT_DEVICE=0;\n' >> ak3/anykernel.sh
          printf 'RAMDISK_COMPRESSION=auto;\n' >> ak3/anykernel.sh
          printf 'PATCH_VBMETA_FLAG=auto;\n\n' >> ak3/anykernel.sh
          printf '. tools/ak3-core.sh;\n\n' >> ak3/anykernel.sh
          printf 'dump_boot;\n' >> ak3/anykernel.sh
          printf 'write_boot;\n' >> ak3/anykernel.sh

          B="${OUT_DIR}/arch/arm64/boot"
          if [ -f "$B/Image.gz-dtb" ]; then cp "$B/Image.gz-dtb" ak3/
          elif [ -f "$B/Image.gz" ]; then cp "$B/Image.gz" ak3/
          elif [ -f "$B/Image" ]; then cp "$B/Image" ak3/
          else echo "::error::no Image"; exit 1; fi
          cd ak3
          ZIP="Oblivionis-4.19-lemonades-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIP" . -x ".git/*"
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Oblivionis-${{ github.run_number }}
          path: |
            Oblivionis-4.19-lemonades-*.img
            Oblivionis-4.19-lemonades-*.zip
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_number }}
          path: kernel/build.log
          retention-days: 7
